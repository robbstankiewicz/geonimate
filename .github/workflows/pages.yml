name: Deploy showcase to GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

concurrency:
    group: github-pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            NX_NO_CLOUD: 'true'
            NX_DAEMON: 'false'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - name: Build showcase
              run: |
                  npx nx run showcase:build:production --base-href=/${{ github.event.repository.name }}/
            - name: SPA fallback for client-side routes
              run: cp dist/apps/showcase/browser/index.html dist/apps/showcase/browser/404.html
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist/apps/showcase/browser

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
