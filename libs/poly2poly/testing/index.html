<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poly2poly vs. Flubber</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    #canvases { display: flex; gap: 1rem; margin-bottom: 1rem; }
    canvas { border: 1px solid black; cursor: crosshair; }
    h2 { margin-bottom: 0; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "poly2poly": "/dist/libs/poly2poly/src/index.js",
      "flubber": "https://cdn.jsdelivr.net/npm/flubber@0.4.2/+esm"
    }
  }
  </script>
</head>
<body>
  <h1>poly2poly vs. Flubber</h1>
  <p>Click on the canvas to draw points for the selected polygon.</p>

  <div id="controls" style="display: flex; gap: 2rem; margin-bottom: 1rem;">
    <div>
      <input type="radio" name="draw-mode" value="poly1" id="draw-poly1" checked>
      <label for="draw-poly1"><b>Draw Polygon 1 (Blue)</b></label>
    </div>
    <div>
      <input type="radio" name="draw-mode" value="poly2" id="draw-poly2">
      <label for="draw-poly2"><b>Draw Polygon 2 (Red)</b></label>
    </div>
  </div>

  <div id="buttons" style="margin-bottom: 1rem;">
      <button id="clear-current">Clear Current Polygon</button>
      <button id="clear-all">Clear All</button>
  </div>

  <div style="margin-bottom: 1rem;">
    <label for="t">Interpolation (t)</label>
    <input type="range" id="t" min="0" max="1" step="0.01" value="0">
    <span id="t-value">0</span>
  </div>

  <div id="canvases">
      <div>
          <h2>poly2poly</h2>
          <canvas id="canvas-ours" width="400" height="400"></canvas>
      </div>
      <div>
          <h2>Flubber</h2>
          <canvas id="canvas-flubber" width="400" height="400"></canvas>
      </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
