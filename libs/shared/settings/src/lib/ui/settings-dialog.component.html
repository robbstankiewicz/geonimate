<p-dialog
    [(visible)]="visible"
    [header]="'Global Settings'"
    [modal]="true"
    [style]="{ width: '30rem' }"
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="true">
    <div class="settings-form">
        <div class="field">
            <label for="timeMs">Timeline Duration (ms)</label>
            <p-inputNumber
                id="timeMs"
                [(ngModel)]="editedTimeMs"
                [min]="1000"
                [max]="300000"
                [step]="1000"
                [showButtons]="true"
                buttonLayout="horizontal"
                spinnerMode="horizontal"
                decrementButtonClass="p-button-secondary"
                incrementButtonClass="p-button-secondary"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus">
            </p-inputNumber>
        </div>

        <div class="field">
            <label for="fps">Grid density (per second)</label>
            <p-inputNumber
                id="fps"
                [(ngModel)]="editedFps"
                [min]="1"
                [max]="60"
                [step]="1"
                [showButtons]="true"
                buttonLayout="horizontal"
                spinnerMode="horizontal"
                decrementButtonClass="p-button-secondary"
                incrementButtonClass="p-button-secondary"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus">
            </p-inputNumber>
        </div>

        <div class="field">
            <label for="fontFamily">Default Font Family</label>
            <p-select
                [appendTo]="'body'"
                id="fontFamily"
                [(ngModel)]="editedFontFamily"
                [options]="fontOptions"
                placeholder="Select font">
            </p-select>
        </div>

        <div class="field">
            <label for="fontSize">Default Font Size</label>
            <p-inputNumber
                id="fontSize"
                [(ngModel)]="editedFontSize"
                [min]="store.minFontSize()"
                [max]="store.maxFontSize()"
                [step]="1"
                [showButtons]="true"
                buttonLayout="horizontal"
                spinnerMode="horizontal"
                decrementButtonClass="p-button-secondary"
                incrementButtonClass="p-button-secondary"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus">
            </p-inputNumber>
        </div>

        <div class="field checkbox-row">
            <p-checkbox
                inputId="scaleTextWithMap"
                [(ngModel)]="editedScaleTextWithMap"
                [binary]="true">
            </p-checkbox>
            <label class="checkbox-label" for="scaleTextWithMap">
                Scale text with map</label>
        </div>

        <div class="field">
            <label for="backgroundLayer"
            >Default Background Layer</label
            >
            <p-select
                id="backgroundLayer"
                [(ngModel)]="editedBackgroundLayer"
                appendTo="body"
                [options]="backgroundOptions"
                placeholder="Select layer">
            </p-select>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [text]="true" (click)="onCancel()">
        </p-button>
        <p-button label="Save" (click)="onSave()"> </p-button>
    </ng-template>
</p-dialog>
